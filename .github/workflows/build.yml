name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-production.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          for (const [label, file] of [['all dependencies', 'audit-all.json'], ['production dependencies', 'audit-production.json']]) {
            const report = JSON.parse(readFileSync(file, 'utf8'))
            const vulnerabilities = Object.entries(report.vulnerabilities || {})
            console.log(label + ': ' + vulnerabilities.length + ' vulnerable package(s)')
            for (const [name, item] of vulnerabilities) {
              const titles = (item.via || []).filter(value => typeof value === 'object').map(value => value.title).join('; ')
              console.log(' - ' + name + ' [' + item.severity + '] direct=' + item.isDirect + ' fix=' + JSON.stringify(item.fixAvailable) + (titles ? ' ' + titles : ''))
            }
          }
          const production = JSON.parse(readFileSync('audit-production.json', 'utf8'))
          const productionVulnerabilities = Object.entries(production.vulnerabilities || {})
          if (productionVulnerabilities.length > 0) {
            console.error('Production dependency audit failed: ' + productionVulnerabilities.length + ' vulnerable package(s).')
            process.exitCode = 1
          } else {
            console.log('Production dependency audit passed: no vulnerable production packages.')
          }
          NODE
      - name: Typecheck and build
        run: npm run build
