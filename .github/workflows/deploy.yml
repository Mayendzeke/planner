name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Studyspace Supabase connection
        env:
          VITE_SUPABASE_URL: https://tibcoottzstnqkfpwabk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim();
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim();
          if (url !== "https://tibcoottzstnqkfpwabk.supabase.co") {
            console.error("The student app is not configured for the Studyspace production project.");
            process.exit(1);
          }
          if (!key || !(key.startsWith("sb_publishable_") || key.startsWith("eyJ"))) {
            console.error("Missing or invalid-format publishable key. Add VITE_SUPABASE_PUBLISHABLE_KEY to the planner repository's Actions variables or secrets.");
            process.exit(1);
          }
          const response = await fetch(url + "/auth/v1/settings", { headers: { apikey: key } });
          if (!response.ok) {
            console.error("Supabase rejected the student app's public API key (HTTP " + response.status + "). Update VITE_SUPABASE_PUBLISHABLE_KEY in the planner repository using the publishable key from the Studyspace Supabase project.");
            process.exit(1);
          }
          console.log("Studyspace Supabase project and public API key validated.");
          const checks = [
            ["enrol-learner", { studentId: "INVALID", pin: "00000000", password: "validation-only", fullName: "Student", preferredName: "Student" }],
            ["student-sign-in", { studentId: "INVALID", password: "validation-only" }],
          ];
          for (const [name, payload] of checks) {
            const response = await fetch(url + "/functions/v1/" + name, {
              method: "POST",
              headers: {
                apikey: key,
                authorization: "Bearer " + key,
                "Content-Type": "application/json",
                Origin: "https://mayendzeke.github.io",
              },
              body: JSON.stringify(payload),
            });
            const detail = (await response.text()).slice(0, 200);
            const expected = name === "enrol-learner" ? 503 : 400;
            if (response.status !== expected) {
              console.error("Edge Function " + name + " did not return its expected response (HTTP " + response.status + ", expected " + expected + "): " + detail);
              process.exit(1);
            }
            if (name === "enrol-learner" && !detail.toLowerCase().includes("temporarily closed")) {
              console.error("Enrolment returned HTTP 503 but not the expected closed-registration message: " + detail);
              process.exit(1);
            }
            console.log("Edge Function " + name + " is deployed and enforcing its expected access response.");
          }
          const { readFileSync } = await import('node:fs')
          const terms = readFileSync('src/components/TermsAndConditions.tsx', 'utf8')
          const studentApp = readFileSync('src/App.tsx', 'utf8')
          const homeworkHelp = readFileSync('src/components/SchoolHomeworkHelp.tsx', 'utf8')
          const accessPage = readFileSync('src/components/StudentAccess.tsx', 'utf8')
          const workflow = readFileSync('.github/workflows/deploy.yml', 'utf8')
          if (!terms.includes('2026-11-08-v6') || !terms.includes('two minutes') || !terms.includes('Cloudflare Workers AI')) throw new Error('Terms v6 must disclose the learner homework AI fallback and photo processing.')
          if (!studentApp.includes('SchoolHomeworkHelp') || !studentApp.includes('AssignedAssessments')) throw new Error('Learner homework and teacher-assigned assessment screens must be connected.')
          if (homeworkHelp.includes('status:"waiting_for_teacher",fallback_due_at:')) throw new Error('The learner must not be able to set the server-side homework fallback deadline.')
          if (!accessPage.includes('publicEnrolmentEnabled') || !accessPage.includes('inviteEnrolmentEnabled') || !workflow.includes("VITE_STUDYSPACE_PUBLIC_ENROLMENT_ENABLED: 'false'
          VITE_STUDYSPACE_INVITE_ENROLMENT_ENABLED: 'false'") || !workflow.includes("VITE_STUDYSPACE_INVITE_ENROLMENT_ENABLED: 'false'")) throw new Error('Public learner enrolment must stay closed while the private invitation-only route remains disabled until server deployment is approved.')
          console.log('Terms v6, connected learner homework, server-owned fallback timing and closed public enrolment checks passed.')
          NODE
      - name: Build app
        env:
          VITE_SUPABASE_URL: https://tibcoottzstnqkfpwabk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_STUDYSPACE_MEET_DOMAIN: ${{ vars.STUDYSPACE_MEET_DOMAIN }}
          VITE_STUDYSPACE_PUBLIC_ENROLMENT_ENABLED: 'false'
        run: npm run build
      - name: Verify Student PWA install assets
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'
          const files = readdirSync('dist')
          const manifestName = files.find(name => name.endsWith('.webmanifest'))
          if (!manifestName) throw new Error('The Student PWA manifest was not generated.')
          const manifest = JSON.parse(readFileSync(join('dist', manifestName), 'utf8'))
          if (manifest.name !== 'StudySpace — Student Academic Planner' || manifest.start_url !== '/planner/' || manifest.scope !== '/planner/') {
            throw new Error('The Student PWA manifest has an unexpected app name, start URL or scope.')
          }
          const pngIcons = (manifest.icons || []).filter(icon => icon.type === 'image/png')
          for (const size of ['192x192', '512x512']) {
            if (!pngIcons.some(icon => icon.sizes === size)) throw new Error('Student manifest is missing its ' + size + ' PNG icon.')
          }
          for (const icon of manifest.icons || []) {
            const relative = String(icon.src).replace('/planner/', '')
            if (!existsSync(join('dist', relative))) throw new Error('A declared Student PWA icon is missing from the build: ' + icon.src)
          }
          if (!files.includes('sw.js')) throw new Error('The Student offline service worker was not generated.')
          if (!readFileSync('src/main.tsx', 'utf8').includes('registerSW({ immediate: true })')) throw new Error('The Student app does not register its PWA service worker.')
          console.log('Student PWA manifest, 192px/512px PNG icons, icon assets and service worker checks passed.')
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
