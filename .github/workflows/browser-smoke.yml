name: Student browser smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install

      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the production bundle for an isolated browser session
        env:
          VITE_SUPABASE_URL: https://tibcoottzstnqkfpwabk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_smoke_test_key
          VITE_STUDYSPACE_PUBLIC_ENROLMENT_ENABLED: 'true'
          VITE_STUDYSPACE_INVITE_ENROLMENT_ENABLED: 'false'
        run: npm run build

      - name: Exercise the production bundle in Chromium
        env:
          VITE_SUPABASE_URL: https://tibcoottzstnqkfpwabk.supabase.co
        run: node scripts/student-browser-smoke.mjs
